name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: 3.47.2

jobs:
  # Static gate. Platform builds depend on it, so a lint failure costs one job.
  analyze:
    name: Analyze and test
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # Semantic half only; the build number comes from github.run_number.
      - name: Read version from pubspec
        id: version
        run: |
          echo "version=$(sed -n 's/^version: *\([^+ ]*\).*/\1/p' pubspec.yaml)" \
            >> "$GITHUB_OUTPUT"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # lib/domain must not import Flutter; that keeps the M2 engine testable
      # under plain `dart test`. The analyzer cannot express a path-scoped
      # import ban, so it is checked here.
      - name: Domain layer stays Flutter-free
        run: |
          if [ -d lib/domain ]; then
            if grep -rn --include='*.dart' -E "^import 'package:flutter" lib/domain; then
              echo "::error::lib/domain must not import Flutter. Move the widget-facing part to lib/features or lib/core."
              exit 1
            fi
            echo "lib/domain is clean."
          else
            echo "lib/domain does not exist yet (arrives in M2)."
          fi

      - run: dart format --output=none --set-exit-if-changed lib test

      - run: flutter analyze --fatal-infos

      # Separate from flutter analyze, which does not load analyzer plugins.
      # riverpod_lint is enabled in analysis_options.yaml and only runs here.
      - run: dart analyze --fatal-infos

      - run: flutter test

  # Release artifacts. Apple platforms out of scope (plan, G3).
  android:
    name: Android APK
    needs: analyze
    runs-on: ubuntu-latest
    env:
      # versionName and versionCode. run_number only ever increases, which is
      # what Android requires to install one build over another.
      BUILD_NAME: ${{ needs.analyze.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: |
          flutter build apk --release \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"

      - name: Name the artifact
        run: |
          mv build/app/outputs/flutter-apk/app-release.apk \
            "sielto-app-$BUILD_NAME+$BUILD_NUMBER.apk"

      # archive: false uploads the file as-is. The artifact takes the file's
      # name; `name` is ignored.
      - uses: actions/upload-artifact@v7
        with:
          path: sielto-app-*.apk
          archive: false
          if-no-files-found: error

  windows:
    name: Windows
    needs: analyze
    runs-on: windows-latest
    env:
      BUILD_NAME: ${{ needs.analyze.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: flutter build windows --release --build-name=$env:BUILD_NAME --build-number=$env:BUILD_NUMBER
        shell: pwsh

      - name: Package
        run: Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath "sielto-app-$env:BUILD_NAME+$env:BUILD_NUMBER-windows.zip"
        shell: pwsh

      - uses: actions/upload-artifact@v7
        with:
          path: sielto-app-*-windows.zip
          archive: false
          if-no-files-found: error

  linux:
    name: Linux AppImage
    needs: analyze
    runs-on: ubuntu-latest
    env:
      BUILD_NAME: ${{ needs.analyze.outputs.version }}
      BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v7

      - name: Install GTK toolchain
        run: |
          sudo apt-get update
          # libsecret is flutter_secure_storage_linux's: it keeps the envelope A
          # wrapping key in the GNOME keyring.
          sudo apt-get install -y clang cmake ninja-build pkg-config \
            libgtk-3-dev liblzma-dev libstdc++-12-dev libsecret-1-dev

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get
      - run: |
          flutter build linux --release \
            --build-name="$BUILD_NAME" --build-number="$BUILD_NUMBER"

      - name: Package AppImage
        run: |
          set -euo pipefail
          APPDIR=build/AppDir
          mkdir -p "$APPDIR/usr/bin"
          cp -r build/linux/x64/release/bundle/* "$APPDIR/usr/bin/"

          cat > "$APPDIR/sielto.desktop" <<'DESKTOP'
          [Desktop Entry]
          Type=Application
          Name=Sielto
          Exec=sielto
          Icon=sielto
          Categories=Office;Finance;
          DESKTOP

          # appimagetool requires an icon next to the .desktop file.
          cp linux/runner/resources/sielto.png "$APPDIR/sielto.png"

          cat > "$APPDIR/AppRun" <<'APPRUN'
          #!/bin/sh
          HERE="$(dirname "$(readlink -f "$0")")"
          exec "$HERE/usr/bin/sielto" "$@"
          APPRUN
          chmod +x "$APPDIR/AppRun"

          wget -q https://github.com/AppImage/AppImageKit/releases/download/continuous/appimagetool-x86_64.AppImage
          chmod +x appimagetool-x86_64.AppImage
          # --appimage-extract-and-run: runners have no FUSE to mount the tool.
          ARCH=x86_64 ./appimagetool-x86_64.AppImage --appimage-extract-and-run \
            "$APPDIR" "sielto-app-$BUILD_NAME+$BUILD_NUMBER-x86_64.AppImage"

      - uses: actions/upload-artifact@v7
        with:
          path: sielto-app-*.AppImage
          archive: false
          if-no-files-found: error
