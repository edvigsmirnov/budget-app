# Static analysis configuration.
#
# lib/domain must not import Flutter. The analyzer cannot express a path-scoped
# import ban, so CI enforces it — see .github/workflows/ci.yml.
#
# Generated sources are excluded from analysis but not from formatting checks.

include: package:flutter_lints/flutter.yaml

# Analyzer plugin, not a dev_dependency. Plugin warnings are on by default;
# plugin lint rules are off unless listed here, so every rule is explicit.
# Run with `dart analyze` — `flutter analyze` does not load plugins.
plugins:
  riverpod_lint:
    version: ^3.1.8
    diagnostics:
      async_value_nullable_pattern: true
      avoid_build_context_in_providers: true
      avoid_keep_alive_dependency_inside_auto_dispose: true
      avoid_public_notifier_properties: true
      avoid_ref_inside_state_dispose: true
      functional_ref: true
      missing_provider_scope: true
      notifier_build: true
      notifier_extends: true
      protected_notifier_properties: true
      provider_dependencies: true
      provider_parameters: true
      riverpod_syntax_error: true
      scoped_providers_should_specify_dependencies: true
      unsupported_provider_value: true

analyzer:
  exclude:
    - build/**
    - android/**
    - linux/**
    - windows/**
    - "**/*.g.dart"
    # drift_dev output, regenerated from the schema snapshots.
    - test/db/generated_migrations/**
    - "**/*.freezed.dart"
    - ios/**
    - web/**
    - macos/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    unused_import: error
    unused_local_variable: error
    unused_element: error
    dead_code: error
    # A missing await in sync or backup code silently loses writes.
    unawaited_futures: error
    todo: ignore

linter:
  rules:
    # --- correctness ---
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    literal_only_boolean_expressions: true
    no_adjacent_strings_in_list: true
    test_types_in_equals: true
    throw_in_finally: true
    unnecessary_statements: true

    # Money uses Decimal, never double. Enforced by review, not lint.
    prefer_int_literals: false

    # --- style ---
    always_use_package_imports: true
    prefer_single_quotes: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    directives_ordering: true
    sort_pub_dependencies: true
    require_trailing_commas: true
    use_string_buffers: true

    # --- API hygiene ---
    public_member_api_docs: false # too noisy for an app
    avoid_positional_boolean_parameters: true
    use_enums: true
