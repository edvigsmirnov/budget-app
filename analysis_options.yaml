# Static analysis configuration.
#
# Two rules here are load-bearing rather than stylistic:
#
#   * `lib/domain/**` must never import Flutter. That constraint is what makes the
#     M2 engine testable with plain `dart test`. The analyzer cannot express a
#     path-scoped import ban, so CI enforces it with a grep step — see
#     .github/workflows/ci.yml. Breaking it will fail the build, not just lint.
#
#   * Generated sources are excluded from analysis but NOT from formatting checks,
#     so a stale `build_runner` run still shows up in review.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - build/**
    - android/**
    - linux/**
    - windows/**
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - ios/**
    - web/**
    - macos/**
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    # Unused code is a bug in the making, not a style preference.
    unused_import: error
    unused_local_variable: error
    unused_element: error
    dead_code: error
    # A missing await in sync/backup code silently loses writes.
    unawaited_futures: error
    # TODOs are fine; untracked ones are not.
    todo: ignore

linter:
  rules:
    # --- correctness ---
    always_declare_return_types: true
    avoid_dynamic_calls: true
    avoid_slow_async_io: true
    cancel_subscriptions: true
    close_sinks: true
    literal_only_boolean_expressions: true
    no_adjacent_strings_in_list: true
    test_types_in_equals: true
    throw_in_finally: true
    unnecessary_statements: true

    # --- money and time ---
    # Doubles are wrong for currency; this project uses Decimal end to end.
    # (Enforced by review, not lint — noted here so the intent is discoverable.)
    prefer_int_literals: false

    # --- style, chosen once so review never argues about it ---
    always_use_package_imports: true
    prefer_single_quotes: true
    prefer_final_locals: true
    prefer_final_in_for_each: true
    directives_ordering: true
    sort_pub_dependencies: true
    require_trailing_commas: true
    use_string_buffers: true

    # --- API hygiene ---
    public_member_api_docs: false # too noisy for an app; enforced on domain/ by review
    avoid_positional_boolean_parameters: true
    use_enums: true
