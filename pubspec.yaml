name: budget_app
description: "Offline-first planner for mandatory payments and shared budgets."
publish_to: 'none'

# Android versionName / versionCode and the Windows product version derive from
# this; `flutter build` can override either half.
version: 1.0.0+1

environment:
  sdk: ^3.13.1

dependencies:
  cupertino_icons: ^1.0.8
  # Localization: JSON dictionaries read directly, no .arb conversion step.
  easy_localization: ^3.0.8
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.4.2
  # Number and date formatting. Locale comes from the device, currency symbol
  # from the Space -- the two are passed to the formatter separately.
  intl: ^0.20.3
  riverpod_annotation: ^4.0.6

dev_dependencies:
  build_runner: ^2.16.0
  flutter_lints: ^6.0.0
  flutter_test:
    sdk: flutter
  riverpod_generator: ^4.0.8
  # easy_localization reads the saved locale through it; widget tests must
  # install a mock store before EasyLocalization.ensureInitialized().
  shared_preferences: ^2.5.3

flutter:
  uses-material-design: true

  assets:
    # One JSON per shipped locale. The pseudolocale has no file: it is derived
    # from en at load time by PseudoAssetLoader.
    - assets/translations/
